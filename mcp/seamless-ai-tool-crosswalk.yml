rest_only:
  - operations: [getAccessToken]
    capability: OAuth token exchange
    reason: >-
      POST /oauth/accessToken is the REST OAuth 2.0 authorization-code exchange. The MCP server
      runs its own OAuth 2.1 authorization server at mcp.seamless.ai with dynamic client
      registration, so the REST token endpoint has no tool equivalent by design.

