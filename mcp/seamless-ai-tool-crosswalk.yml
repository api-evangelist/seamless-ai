  divergence_note: >-
    46 of 54 tools (85%) are MCP-only. An integrator choosing REST over MCP gets search, research,
    polling and org-data reads — and nothing else. Lists, saved searches, campaigns, templates,
    email, calls, tasks and the activity feed exist for agents only.
