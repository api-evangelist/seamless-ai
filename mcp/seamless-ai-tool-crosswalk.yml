    file: openapi/_original/seamless-ai-public-api-openapi-original.json
    source: https://docs.seamless.ai/openapi.json
    server: https://api.seamless.ai/api/client/v1
    operations: 9
    gated: false
  mcp:
    url: https://mcp.seamless.ai/mcp
    spec: https://docs.seamless.ai/mcp-openapi.yaml
    tools: 54
    gated: true
    gate: OAuth 2.1 (scope mcp.all); anonymous tools/list returns 401
  graphql:
    present: false

crosswalk:
  - tool: search_contacts
    category: search
    rest: [searchContacts]
    binding: rest
    confidence: high
    note: Same filter vocabulary as POST /search/contacts; returns searchResultId values.
  - tool: search_companies
    category: search
    rest: [searchCompanies]
    binding: rest
    confidence: high
  - tool: research_contacts
    category: research
    rest: [researchContacts, pollContactsResearchResults]
    binding: rest
    confidence: high
    note: >-
      Fans out to two REST operations. The tool's `waitForResults: true` option folds the poll
      loop server-side, which the REST API does not offer — REST callers must poll themselves.
  - tool: poll_contact_research
    category: research
    rest: [pollContactsResearchResults]
    binding: rest
    confidence: high
  - tool: research_companies
    category: research
    rest: [researchCompanies, pollCompanyResearchResults]
    binding: rest
    confidence: high
  - tool: poll_company_research
    category: research
    rest: [pollCompanyResearchResults]
    binding: rest
    confidence: high
  - tool: get_my_contacts
    category: user
    rest: [getContacts]
    binding: rest
    confidence: high
    note: GET /contacts takes required startDate/endDate; the tool's documented 30-day ceiling
      matches that window.
  - tool: get_my_companies
    category: user
    rest: [getCompanies]
    binding: rest
    confidence: high
  - tool: get_credits
    category: user
    rest: []
    binding: none
    confidence: high
    note: >-
      No REST operation returns a credit balance. The docs state plainly there is no dedicated v1
      credits endpoint — REST callers must read the X-PublicAPI-Credits response header. The MCP
      tool and the seamless://credits resource are the only first-class credit reads.

