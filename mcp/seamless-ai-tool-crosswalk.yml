source: mcp/seamless-ai-mcp.yml + openapi/_original/seamless-ai-public-api-openapi-original.json
note: >-
  Binds each published Seamless.AI MCP tool to the REST operation(s) that back it. The MCP
  tools/list endpoint is OAuth-gated (401 anonymous), so tool names, descriptions and risk tiers
  come from the provider's own per-domain reference pages and the mapping below is by
  name/semantics against verified REST operationIds. Confidence is recorded honestly per row.
  The headline finding is the size of the divergence: the MCP server exposes 54 tools, the public
  REST API exposes 9 operations, and 44 of those tools have no public REST equivalent at all.
  Everything Seamless calls "Connect" — campaigns, email, calls, tasks, templates, activity — is
  agent-reachable only through MCP.

