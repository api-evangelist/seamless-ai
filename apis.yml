  - aid: seamless-ai:seamless-ai-mcp-server
    name: Seamless.AI MCP Server
    description: >-
      Hosted Model Context Protocol server exposing 54 tools across 11 domains — search, research,
      user, lists, saved searches, campaigns, templates, email, calls, tasks and activity — plus
      seven read-only seamless:// resources. Secured with OAuth 2.1 (PKCE S256, dynamic client
      registration, scope mcp.all). Covers Connect products the REST API does not expose at all.
    humanURL: https://docs.seamless.ai/mcp-docs
