name: Seamless.AI
type: Index
specificationVersion: '0.19'
description: >-
  Seamless.AI is a B2B sales intelligence platform that provides real-time contact and company data
  to help sales teams find and connect with their ideal customers. The platform uses artificial
  intelligence to continuously verify and update contact information including emails, direct dials
  and mobile numbers. Its Public API v1 is a three-hop enrichment pipeline — search, research, then
  collect by polling or webhook — secured with an API key in a Token header or OAuth 2.0, and
  metered in research credits rather than API calls. Alongside the nine-operation REST API,
  Seamless.AI operates a hosted Model Context Protocol server exposing 54 tools across search,
  research, lists, saved searches, campaigns, templates, email, calls, tasks and activity, secured
  with OAuth 2.1, dynamic client registration and published per-tool risk tiers.
