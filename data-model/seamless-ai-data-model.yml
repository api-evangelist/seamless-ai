envelopes:
  search: '{data: [...], supplementalData: {...}}'
  org_data: '{data: [...]}'
  research: '{success: bool, requestIds: [...]}'
  poll: '{success: bool, data: [{requestId, searchResultId, status, message, contact|company, additionalData}]}'
  note: >-
    The envelope is not consistent across the API. Search and org-data return `{data}`, research
    and poll add a `success` boolean. A generic client cannot assume one wrapper.

observations:
  - >-
    components.schemas is empty. The identical 101-field Contact shape is re-declared inline in
    every operation that returns it, so any generated client produces duplicate anonymous types
    and any change must be made in several places at once.
  - >-
    There is no DELETE, PATCH or PUT anywhere in the public API. The only mutation is submitting
    an enrichment job. Everything else — lists, saved searches, campaigns, tasks — exists only on
    the MCP surface.
